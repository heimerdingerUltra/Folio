<svg class="chart" viewBox="-16 -16 752 272" width="752" role="img" aria-label="Distribution of chunk length in tokens" xmlns="http://www.w3.org/2000/svg"><style>svg { color-scheme: light; --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --good: #006300; --bad: #d03b3b; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --mute: #c3c2b7; }
@media (prefers-color-scheme: dark) { svg:not([data-theme='light']) { color-scheme: dark; --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --good: #0ca30c; --bad: #e66767; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --mute: #52514e; } }
svg[data-theme='dark'] { color-scheme: dark; --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --good: #0ca30c; --bad: #e66767; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --mute: #52514e; }

.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
.chart .value { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .note { fill: var(--muted); font-size: 11px; }
.chart .mark { transition: opacity .12s; }
.chart .mark:hover { opacity: .78; }
